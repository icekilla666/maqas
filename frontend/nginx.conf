server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Эти файлы должны проверяться на сервере при обновлении PWA.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-.*\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
